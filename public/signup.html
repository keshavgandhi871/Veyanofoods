<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Create your Veyano account to manage orders, view your profile, and more.">
  <meta name="robots" content="noindex, nofollow">
  
  <title>Sign Up | Veyano Foods</title>
  <!-- Favicon & Search Engine Icons -->
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#fdfbf7">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">

  <!-- Navbar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-brand" aria-label="VEYANO Foods">
        <img src="assets/logo.png" alt="VEYANO Logo" width="140" height="42">
      </a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="shop.html" class="nav-link">Shop</a></li>
          <li><a href="try-veyano.html" class="nav-link">Try VEYANO</a></li>
          <li><a href="our-story.html" class="nav-link">Our Story</a></li>
          <li><a href="transparency.html" class="nav-link">Transparency</a></li>
          <li><a href="blog.html" class="nav-link">Journal</a></li>
          <li><a href="bulk-orders.html" class="nav-link">Bulk Orders</a></li>
        </ul>
      </nav>
      <div class="nav-actions">
        <a href="shop.html" class="btn btn-sm btn-outline nav-shop-btn">Shop Now</a>
        <button class="cart-icon-btn cart-trigger-btn" aria-label="Open Cart">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
          <span class="cart-badge" id="cart-count">0</span>
        </button>
        <button class="mobile-menu-toggle" id="mobile-nav-toggle" aria-label="Open Menu">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="auth-main">
    <div class="container auth-container">
      <div class="auth-card">
        <div id="clerk-signup-container">
          <div id="clerk-loading" style="text-align: center; padding: 3rem 2rem;">
            <div style="display: inline-block; width: 40px; height: 40px; border: 3px solid #e4e4e7; border-top-color: #000; border-radius: 50%; animation: clerkSpin 0.8s linear infinite;"></div>
            <p style="font-family: 'Outfit', sans-serif; font-size: 0.95rem; color: #71717a; margin-top: 1rem;">Loading sign-up...</p>
          </div>
          <style>
            @keyframes clerkSpin {
              to { transform: rotate(360deg); }
            }
          </style>
        </div>
      </div>
    </div>
  </main>

  <!-- Liquid Ether Background -->
  <canvas id="liquid-ether"></canvas>
  <script src="liquid-ether.js"></script>
  <script src="products-data.js"></script>
  <script src="script.js"></script>
</body>
</html>
